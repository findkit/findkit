<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Search UI Test</title>
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<link rel="stylesheet" href="/shared.css" />

		<script type="module" id="test">
			import { FindkitUI } from "/build/esm/index.js";

			/**
			 * Custom RouterBackend saving the search state to sessionStorage
			 * instead of the URL
			 */
			function createSessionStorageBackend() {
				const storageKey = "findkit-search";
				const listeners = new Set();
				let state = {};

				return {
					getSearchParamsString: () => sessionStorage.getItem(storageKey) ?? "",
					update: (next, options) => {
						// The UI replaces the state without changing the params
						// when it saves the scroll position etc. The listeners
						// must be called for these updates too.
						const replacingState = options?.push === false && options.state;

						if (options?.state) {
							state = options.state;
						}

						if (
							sessionStorage.getItem(storageKey) === next &&
							!replacingState
						) {
							return;
						}

						sessionStorage.setItem(storageKey, next);

						for (const listener of listeners) {
							listener();
						}
					},
					listen: (cb) => {
						listeners.add(cb);
						return () => listeners.delete(cb);
					},
					formatHref: () => "#",
					getState: () => state,
				};
			}

			const ui = new FindkitUI({
				publicToken: "po8GK3G0r",
				router: createSessionStorageBackend(),
				groups: [
					{
						id: "valu",
						title: "Valu.fi",
						relevancyBoost: 1,
						previewSize: 5,
						params: {
							tagQuery: [["domain/valu.fi"]],
							highlightLength: 10,
						},
					},
					{
						id: "statement",
						title: "Statement.fi",
						relevancyBoost: 1,
						previewSize: 5,
						params: {
							tagQuery: [["domain/statement.fi"]],
							highlightLength: 10,
						},
					},
				],
			});

			Object.assign(window, { ui });

			ui.openFrom("button");
		</script>
	</head>
	<body>
		<button id="open-button" type="button">open</button>
	</body>
</html>
