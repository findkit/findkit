<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Static Template</title>
		<style>
			.url {
				font-family: monospace;
				background-color: #eee;
				padding: 0.5rem;
				margin-top: 1rem;
				word-break: break-all;
			}
		</style>
		<script type="module">
			import { FindkitUI } from "https://cdn.findkit.com/ui/v1.1.0/esm/index.js";

			const ui = new FindkitUI({
				publicToken: "p68GxRvaA",
				// Keep the search state only in memory. The URL is never
				// touched, but the search terms are lost on page refresh and
				// the back button does not close the search.
				// https://docs.findkit.com/ui/api/#router
				router: "memory",
			});

			ui.openFrom("#open");

			// Display the current URL so the router behaviour is visible.
			const url = document.querySelector("#url");
			setInterval(() => {
				url.textContent = location.pathname + location.search + location.hash;
			}, 250);
		</script>
	</head>
	<body>
		<button id="open" type="button">Open Search</button>
		<p>The current URL is:</p>
		<div class="url" id="url"></div>
		<p>
			Type some search terms and note that the URL never changes. This also
			means the search state is lost on page refresh and the back button does
			not close the search.
		</p>
	</body>
</html>
